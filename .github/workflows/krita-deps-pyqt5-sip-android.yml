name: Krita deps PyQt5 SIP Android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/krita-deps-pyqt5-sip-android.yml"
      - "patches/krita-deps-management/*.patch"

jobs:
  build:
    name: Build PyQt5_sip ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - x86_64

    steps:
      - name: Checkout port lab
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up host Python for dependency tools
        run: |
          python3 -m venv .venv --upgrade-deps
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Clone Krita deps management
        run: |
          git clone --depth 1 https://invent.kde.org/packaging/krita-deps-management.git upstream/krita-deps-management

      - name: Apply dependency patches
        run: |
          for patch in patches/krita-deps-management/*.patch; do
            git -C upstream/krita-deps-management apply "$GITHUB_WORKSPACE/$patch"
          done

      - name: Build Python tools and PyQt5_sip
        run: |
          set -eux

          configure_and_install() {
            dep="$1"
            cmake \
              -S "upstream/krita-deps-management/${dep}" \
              -B "build/pyqt5-sip/${{ matrix.abi }}/${dep}" \
              -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.3.13750724/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="${{ matrix.abi }}" \
              -DANDROID_PLATFORM=android-24 \
              -DANDROID_STL=c++_shared \
              -DEXTERNALS_DOWNLOAD_DIR="$GITHUB_WORKSPACE/artifacts/krita-deps-downloads" \
              -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/artifacts/krita-pyqt5-sip/${{ matrix.abi }}"

            cmake --build "build/pyqt5-sip/${{ matrix.abi }}/${dep}" --target ext_install --verbose
          }

          configure_and_install ext_python
          configure_and_install ext_sip
          configure_and_install ext_pyqt-builder
          configure_and_install ext_pyqt5-sip

      - name: Verify Android PyQt5_sip module
        run: |
          set -eux

          prefix="$GITHUB_WORKSPACE/artifacts/krita-pyqt5-sip/${{ matrix.abi }}"
          readelf="$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          case "${{ matrix.abi }}" in
            arm64-v8a)
              triplet="aarch64-linux-android"
              machine_pattern="Machine:[[:space:]]*AArch64"
              ;;
            x86_64)
              triplet="x86_64-linux-android"
              machine_pattern="Machine:[[:space:]]*Advanced Micro Devices X86-64"
              ;;
          esac

          module="$prefix/lib/python3.14/site-packages/PyQt5/sip.cpython-314-${triplet}.so"
          test -f "$module"
          test -f "$prefix/include/python3.14/sip.h"
          file "$module"

          "$readelf" -h "$module" | tee "$RUNNER_TEMP/pyqt5-sip-elf-header.txt"
          grep -Eq "$machine_pattern" "$RUNNER_TEMP/pyqt5-sip-elf-header.txt"

          "$readelf" -d "$module" | tee "$RUNNER_TEMP/pyqt5-sip-dynamic.txt"
          grep -q "Shared library: \\[libpython3.14.so\\]" "$RUNNER_TEMP/pyqt5-sip-dynamic.txt"

      - name: Upload PyQt5_sip prefix
        uses: actions/upload-artifact@v4
        with:
          name: krita-deps-pyqt5-sip-${{ matrix.abi }}
          path: artifacts/krita-pyqt5-sip/${{ matrix.abi }}
