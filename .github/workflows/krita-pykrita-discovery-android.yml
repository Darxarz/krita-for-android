name: Krita PyKrita discovery Android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/krita-pykrita-discovery-android.yml"
      - "patches/krita/*.patch"

jobs:
  probe:
    name: Probe PyKrita discovery ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - x86_64

    steps:
      - name: Checkout port lab
        uses: actions/checkout@v4

      - name: Download minimal Krita CMake files
        run: |
          set -eux

          base="https://invent.kde.org/graphics/krita/-/raw/master"
          mkdir -p upstream/krita

          download_file() {
            path="$1"
            mkdir -p "upstream/krita/$(dirname "$path")"
            curl -fsSL "$base/$path" -o "upstream/krita/$path"
          }

          download_file CMakeLists.txt
          download_file cmake/modules/FindPyQt5.cmake
          download_file cmake/modules/FindPythonLibrary.cmake
          download_file cmake/modules/FindSIP.cmake
          download_file cmake/modules/SIPMacros.cmake
          download_file plugins/extensions/pykrita/CMakeLists.txt

      - name: Apply Krita patches
        run: |
          set -eux

          git -C upstream/krita init
          for patch in patches/krita/*.patch; do
            git -C upstream/krita apply --check "$GITHUB_WORKSPACE/$patch"
            git -C upstream/krita apply "$GITHUB_WORKSPACE/$patch"
          done

      - name: Create fake Android Python and PyQt prefix
        run: |
          set -eux

          prefix="$GITHUB_WORKSPACE/artifacts/krita-pykrita-discovery/${{ matrix.abi }}"
          host_python_minor="$(python3 - <<'PY'
          import sys
          print(f"{sys.version_info.major}.{sys.version_info.minor}")
          PY
          )"

          mkdir -p "$prefix/include/python3.14"
          mkdir -p "$prefix/lib/python3.14/site-packages/PyQt5/bindings/QtCore"
          mkdir -p "$prefix/lib/python3.14/site-packages/PyQt5/bindings/QtNetwork"
          mkdir -p "$prefix/lib/python3.14/site-packages/PyQt5/bindings/QtGui"
          mkdir -p "$prefix/lib/python3.14/site-packages/PyQt5/bindings/QtWidgets"
          mkdir -p "$prefix/lib/python${host_python_minor}/site-packages"
          mkdir -p "$prefix/bin"

          touch "$prefix/include/python3.14/Python.h"
          touch "$prefix/lib/libpython3.14.so"
          touch "$prefix/lib/python3.14/site-packages/PyQt5/bindings/QtCore/QtCore.toml"
          touch "$prefix/lib/python3.14/site-packages/PyQt5/bindings/QtNetwork/QtNetwork.toml"
          touch "$prefix/lib/python3.14/site-packages/PyQt5/bindings/QtGui/QtGui.toml"
          touch "$prefix/lib/python3.14/site-packages/PyQt5/bindings/QtWidgets/QtWidgets.toml"

          cat > "$prefix/bin/sip-build" <<'SH'
          #!/usr/bin/env sh
          exit 0
          SH
          chmod +x "$prefix/bin/sip-build"

      - name: Configure PyKrita discovery probe
        run: |
          set -eux

          prefix="$GITHUB_WORKSPACE/artifacts/krita-pykrita-discovery/${{ matrix.abi }}"
          mkdir -p probe

          cat > probe/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.21)
          project(pykrita_discovery_probe NONE)

          set(ANDROID TRUE)
          set(ENABLE_ANDROID_PYKRITA_EXPERIMENTAL ON)
          set(CMAKE_MODULE_PATH "${KRITA_SOURCE_DIR}/cmake/modules")
          set(CMAKE_PREFIX_PATH "${ANDROID_PREFIX}")

          find_package(PythonLibrary 3.8 REQUIRED)
          find_package(SIP "4.19.13" REQUIRED)
          find_package(PyQt5 "5.6.0" REQUIRED)

          foreach(required_var
                  PYTHON_EXECUTABLE
                  PYTHON_LIBRARY
                  PYTHON_INCLUDE_DIRS
                  PYTHON_SITE_PACKAGES_DIR
                  SIP_EXECUTABLE
                  SIP_VERSION_STR
                  PYQT5_VERSION_STR
                  PYQT5_SIP_DIR
                  PYQT5_SIP_NAME
                  PYQT5_SIP_TAGS)
            if(NOT DEFINED ${required_var} OR "${${required_var}}" STREQUAL "")
              message(FATAL_ERROR "${required_var} was not discovered")
            endif()
          endforeach()

          if(NOT Python_Development_FOUND)
            message(FATAL_ERROR "Python_Development_FOUND should be true for Android target Python")
          endif()

          if(NOT PYTHON_LIBRARY MATCHES "/lib/libpython3\\.14\\.so$")
            message(FATAL_ERROR "PYTHON_LIBRARY does not point to target Android Python: ${PYTHON_LIBRARY}")
          endif()

          if(NOT PYTHON_INCLUDE_DIRS MATCHES "/include/python3\\.14$")
            message(FATAL_ERROR "PYTHON_INCLUDE_DIRS does not point to target Android Python: ${PYTHON_INCLUDE_DIRS}")
          endif()

          if(NOT PYTHON_SITE_PACKAGES_DIR MATCHES "/lib/python3\\.14/site-packages$")
            message(FATAL_ERROR "PYTHON_SITE_PACKAGES_DIR does not point to target Android site-packages: ${PYTHON_SITE_PACKAGES_DIR}")
          endif()

          if(NOT PYQT5_SIP_DIR MATCHES "/lib/python3\\.14/site-packages/PyQt5/bindings$")
            message(FATAL_ERROR "PYQT5_SIP_DIR does not point to target Android PyQt5 bindings: ${PYQT5_SIP_DIR}")
          endif()

          message(STATUS "Android PyKrita discovery probe passed")
          CMAKE

          cmake -S probe -B build/pykrita-discovery/${{ matrix.abi }} \
            -DKRITA_SOURCE_DIR="$GITHUB_WORKSPACE/upstream/krita" \
            -DANDROID_PREFIX="$prefix"
