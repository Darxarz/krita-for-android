          grep -q "Shared library: \\[libkritaflake.so\\]" "$RUNNER_TEMP/kritawidgets-dynamic.txt"
          grep -q "Shared library: \\[libkritapigment.so\\]" "$RUNNER_TEMP/kritawidgets-dynamic.txt"
          grep -q "Shared library: \\[libkritawidgetutils.so\\]" "$RUNNER_TEMP/kritawidgets-dynamic.txt"
          grep -q "Shared library: \\[libkritaresources.so\\]" "$RUNNER_TEMP/kritawidgets-dynamic.txt"
          grep -q "Shared library: \\[libkritaresourcewidgets.so\\]" "$RUNNER_TEMP/kritawidgets-dynamic.txt"
          grep -q "Shared library: \\[libQt5Core_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritawidgets-dynamic.txt"
          grep -q "Shared library: \\[libQt5Gui_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritawidgets-dynamic.txt"
          grep -q "Shared library: \\[libQt5Widgets_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritawidgets-dynamic.txt"
          grep -q "Shared library: \\[libQt5PrintSupport_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritawidgets-dynamic.txt"

          "$readelf" -Ws "$widgets_library" | tee "$RUNNER_TEMP/kritawidgets-symbols.txt"
          grep -q "KoZoomAction" "$RUNNER_TEMP/kritawidgets-symbols.txt"

          "$readelf" -h "$psdutils_library" | tee "$RUNNER_TEMP/kritapsdutils-elf-header.txt"
          grep -Eq "$machine_pattern" "$RUNNER_TEMP/kritapsdutils-elf-header.txt"

          "$readelf" -d "$psdutils_library" | tee "$RUNNER_TEMP/kritapsdutils-dynamic.txt"
          grep -q "Shared library: \\[libkritapigment.so\\]" "$RUNNER_TEMP/kritapsdutils-dynamic.txt"
          grep -q "Shared library: \\[libkritaglobal.so\\]" "$RUNNER_TEMP/kritapsdutils-dynamic.txt"
          grep -q "Shared library: \\[libkritaflake.so\\]" "$RUNNER_TEMP/kritapsdutils-dynamic.txt"
          grep -q "Shared library: \\[libQt5Core_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritapsdutils-dynamic.txt"
          grep -q "Shared library: \\[libQt5Gui_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritapsdutils-dynamic.txt"

          "$readelf" -Ws "$psdutils_library" | tee "$RUNNER_TEMP/kritapsdutils-symbols.txt"
          grep -q "KisAslReader" "$RUNNER_TEMP/kritapsdutils-symbols.txt"

          "$readelf" -h "$image_library" | tee "$RUNNER_TEMP/kritaimage-elf-header.txt"
          grep -Eq "$machine_pattern" "$RUNNER_TEMP/kritaimage-elf-header.txt"

          "$readelf" -d "$image_library" | tee "$RUNNER_TEMP/kritaimage-dynamic.txt"
          grep -q "Shared library: \\[libkritawidgets.so\\]" "$RUNNER_TEMP/kritaimage-dynamic.txt"
          grep -q "Shared library: \\[libkritapsdutils.so\\]" "$RUNNER_TEMP/kritaimage-dynamic.txt"
          grep -q "Shared library: \\[libkritapigment.so\\]" "$RUNNER_TEMP/kritaimage-dynamic.txt"
          grep -q "Shared library: \\[libkritamultiarch.so\\]" "$RUNNER_TEMP/kritaimage-dynamic.txt"
          grep -q "Shared library: \\[libQt5Core_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaimage-dynamic.txt"
          grep -q "Shared library: \\[libQt5Gui_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaimage-dynamic.txt"

          "$readelf" -Ws "$image_library" | tee "$RUNNER_TEMP/kritaimage-symbols.txt"
          grep -q "KisImage" "$RUNNER_TEMP/kritaimage-symbols.txt"

      - name: Upload real Krita seed libs
        uses: actions/upload-artifact@v4
        with:
          name: krita-real-libs-seed-${{ matrix.abi }}
          path: build/krita-real-libs-seed/${{ matrix.abi }}
