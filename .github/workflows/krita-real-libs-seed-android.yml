name: Krita real libs seed Android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/krita-real-libs-seed-android.yml"
      - "probes/krita-real-libs-seed/**"
      - "patches/krita/*.patch"

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build real Krita seed libs ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - x86_64

    steps:
      - name: Checkout port lab
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            libboost-dev \
            libeigen3-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            libunibreak-dev \
            libxsimd-dev

      - name: Download Android PyQt5 dependency prefix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux

          run_id="$(gh run list \
            --workflow krita-deps-pyqt5-minimal-android.yml \
            --branch "$GITHUB_REF_NAME" \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$run_id"

          prefix="$GITHUB_WORKSPACE/artifacts/krita-pyqt5-minimal/${{ matrix.abi }}"
          mkdir -p "$prefix"
          gh run download "$run_id" \
            --name "krita-deps-pyqt5-minimal-${{ matrix.abi }}" \
            --dir "$prefix"

          case "${{ matrix.abi }}" in
            arm64-v8a)
              machine_pattern="Machine:[[:space:]]*AArch64"
              ;;
            x86_64)
              machine_pattern="Machine:[[:space:]]*Advanced Micro Devices X86-64"
              ;;
          esac

          echo "machine_pattern=$machine_pattern" >> "$GITHUB_ENV"

          test -d "$prefix/include/QtCore"
          test -d "$prefix/include/QtGui"
          test -d "$prefix/include/QtWidgets"
          test -d "$prefix/include/QtXml"
          test -d "$prefix/include/QtSvg"
          test -d "$prefix/include/QtSql"
          test -d "$prefix/include/QtPrintSupport"
          test -d "$prefix/include/QtAndroidExtras"
          test -f "$prefix/lib/libQt5Core_${{ matrix.abi }}.so"
          test -f "$prefix/lib/libQt5Gui_${{ matrix.abi }}.so"
          test -f "$prefix/lib/libQt5Widgets_${{ matrix.abi }}.so"
          test -f "$prefix/lib/libQt5Xml_${{ matrix.abi }}.so"
          test -f "$prefix/lib/libQt5Svg_${{ matrix.abi }}.so"
          test -f "$prefix/lib/libQt5Sql_${{ matrix.abi }}.so"
          test -f "$prefix/lib/libQt5PrintSupport_${{ matrix.abi }}.so"
          test -f "$prefix/lib/libQt5AndroidExtras_${{ matrix.abi }}.so"

      - name: Clone sparse Krita checkout
        run: |
          set -eux

          if ! git clone --depth 1 --filter=blob:none --sparse https://invent.kde.org/graphics/krita.git upstream/krita; then
            rm -rf upstream/krita
            git clone --depth 1 --filter=blob:none --sparse https://github.com/KDE/krita.git upstream/krita
          fi
          git -C upstream/krita sparse-checkout set --skip-checks \
            CMakeLists.txt \
            config_convolution.h.cmake \
            config-hash-table-implementation.h.cmake \
            KoConfig.h.cmake \
            3rdparty_vendor/raqm \
            cmake/modules \
            config-android-stdio-forwarding.h.cmake \
            config-gsl.h.cmake \
            config-safe-asserts.h.cmake \
            libs/color \
            libs/command \
            libs/flake \
            libs/global \
            libs/image \
            libs/koplugin \
            libs/metadata \
            libs/multiarch \
            libs/pigment \
            libs/psdutils \
            libs/resources \
            libs/resourcewidgets \
            libs/store \
            libs/version \
            libs/widgets \
            libs/widgetutils \
            plugins/extensions/pykrita

      - name: Apply Krita patches
        run: |
          set -eux

          for patch in patches/krita/*.patch; do
            git -C upstream/krita apply --check "$GITHUB_WORKSPACE/$patch"
            git -C upstream/krita apply "$GITHUB_WORKSPACE/$patch"
          done

      - name: Configure real Krita seed libs
        run: |
          set -eux

          prefix="$GITHUB_WORKSPACE/artifacts/krita-pyqt5-minimal/${{ matrix.abi }}"

          cmake -S probes/krita-real-libs-seed \
            -B build/krita-real-libs-seed/${{ matrix.abi }} \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.3.13750724/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DKRITA_SOURCE_DIR="$GITHUB_WORKSPACE/upstream/krita" \
            -DANDROID_PREFIX="$prefix"

      - name: Build and verify Krita seed libraries
        run: |
          set -eux

          build_dir="build/krita-real-libs-seed/${{ matrix.abi }}"
          readelf="$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          cmake --build "$build_dir" --target \
            kritaversion \
            kritaglobal \
            kritaplugin \
            kritamultiarch \
            kritacolor \
            kritastore \
            kritaresources \
            kritawidgetutils \
            kritacommand \
            kritapigment \
            kritametadata \
            kritaflake \
            kritaresourcewidgets \
            kritawidgets \
            kritapsdutils \
            kritaimage \
            --verbose

          version_library="$(find "$build_dir" -name 'libkritaversion.so' -print -quit)"
          global_library="$(find "$build_dir" -name 'libkritaglobal.so' -print -quit)"
          plugin_library="$(find "$build_dir" -name 'libkritaplugin.so' -print -quit)"
          multiarch_library="$(find "$build_dir" -name 'libkritamultiarch.so' -print -quit)"
          color_library="$(find "$build_dir" -name 'libkritacolor.so' -print -quit)"
          store_library="$(find "$build_dir" -name 'libkritastore.so' -print -quit)"
          resources_library="$(find "$build_dir" -name 'libkritaresources.so' -print -quit)"
          widgetutils_library="$(find "$build_dir" -name 'libkritawidgetutils.so' -print -quit)"
          command_library="$(find "$build_dir" -name 'libkritacommand.so' -print -quit)"
          pigment_library="$(find "$build_dir" -name 'libkritapigment.so' -print -quit)"
          metadata_library="$(find "$build_dir" -name 'libkritametadata.so' -print -quit)"
          flake_library="$(find "$build_dir" -name 'libkritaflake.so' -print -quit)"
          resourcewidgets_library="$(find "$build_dir" -name 'libkritaresourcewidgets.so' -print -quit)"
          widgets_library="$(find "$build_dir" -name 'libkritawidgets.so' -print -quit)"
          psdutils_library="$(find "$build_dir" -name 'libkritapsdutils.so' -print -quit)"
          image_library="$(find "$build_dir" -name 'libkritaimage.so' -print -quit)"
          test -n "$version_library"
          test -n "$global_library"
          test -n "$plugin_library"
          test -n "$multiarch_library"
          test -n "$color_library"
          test -n "$store_library"
          test -n "$resources_library"
          test -n "$widgetutils_library"
          test -n "$command_library"
          test -n "$pigment_library"
          test -n "$metadata_library"
          test -n "$flake_library"
          test -n "$resourcewidgets_library"
          test -n "$widgets_library"
          test -n "$psdutils_library"
          test -n "$image_library"
          file "$version_library"
          file "$global_library"
          file "$plugin_library"
          file "$multiarch_library"
          file "$color_library"
          file "$store_library"
          file "$resources_library"
          file "$widgetutils_library"
          file "$command_library"
          file "$pigment_library"
          file "$metadata_library"
          file "$flake_library"
          file "$resourcewidgets_library"
          file "$widgets_library"
          file "$psdutils_library"
          file "$image_library"

          "$readelf" -h "$version_library" | tee "$RUNNER_TEMP/kritaversion-elf-header.txt"
          grep -Eq "$machine_pattern" "$RUNNER_TEMP/kritaversion-elf-header.txt"

          "$readelf" -d "$version_library" | tee "$RUNNER_TEMP/kritaversion-dynamic.txt"
          grep -q "Shared library: \\[libQt5Core_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaversion-dynamic.txt"

          "$readelf" -Ws "$version_library" | tee "$RUNNER_TEMP/kritaversion-symbols.txt"
          grep -q "_ZN19KritaVersionWrapper13versionString" "$RUNNER_TEMP/kritaversion-symbols.txt"

          "$readelf" -h "$global_library" | tee "$RUNNER_TEMP/kritaglobal-elf-header.txt"
          grep -Eq "$machine_pattern" "$RUNNER_TEMP/kritaglobal-elf-header.txt"

          "$readelf" -d "$global_library" | tee "$RUNNER_TEMP/kritaglobal-dynamic.txt"
          grep -q "Shared library: \\[libkritaversion.so\\]" "$RUNNER_TEMP/kritaglobal-dynamic.txt"
          grep -q "Shared library: \\[libQt5Core_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaglobal-dynamic.txt"
          grep -q "Shared library: \\[libQt5Gui_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaglobal-dynamic.txt"
          grep -q "Shared library: \\[libQt5Widgets_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaglobal-dynamic.txt"
          grep -q "Shared library: \\[libQt5Xml_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaglobal-dynamic.txt"
          grep -q "Shared library: \\[libQt5AndroidExtras_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaglobal-dynamic.txt"

          "$readelf" -Ws "$global_library" | tee "$RUNNER_TEMP/kritaglobal-symbols.txt"
          grep -q "_ZN14KisUsageLogger10initializeEv" "$RUNNER_TEMP/kritaglobal-symbols.txt"

          "$readelf" -h "$plugin_library" | tee "$RUNNER_TEMP/kritaplugin-elf-header.txt"
          grep -Eq "$machine_pattern" "$RUNNER_TEMP/kritaplugin-elf-header.txt"

          "$readelf" -d "$plugin_library" | tee "$RUNNER_TEMP/kritaplugin-dynamic.txt"
          grep -q "Shared library: \\[libkritaglobal.so\\]" "$RUNNER_TEMP/kritaplugin-dynamic.txt"
          grep -q "Shared library: \\[libQt5Core_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaplugin-dynamic.txt"

          "$readelf" -Ws "$plugin_library" | tee "$RUNNER_TEMP/kritaplugin-symbols.txt"
          grep -q "KoPluginLoader" "$RUNNER_TEMP/kritaplugin-symbols.txt"

          "$readelf" -h "$multiarch_library" | tee "$RUNNER_TEMP/kritamultiarch-elf-header.txt"
          grep -Eq "$machine_pattern" "$RUNNER_TEMP/kritamultiarch-elf-header.txt"

          "$readelf" -d "$multiarch_library" | tee "$RUNNER_TEMP/kritamultiarch-dynamic.txt"
          grep -q "Shared library: \\[libkritaglobal.so\\]" "$RUNNER_TEMP/kritamultiarch-dynamic.txt"
          grep -q "Shared library: \\[libQt5Core_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritamultiarch-dynamic.txt"

          "$readelf" -Ws "$multiarch_library" | tee "$RUNNER_TEMP/kritamultiarch-symbols.txt"
          grep -q "vectorizationConfiguration" "$RUNNER_TEMP/kritamultiarch-symbols.txt"

          "$readelf" -h "$color_library" | tee "$RUNNER_TEMP/kritacolor-elf-header.txt"
          grep -Eq "$machine_pattern" "$RUNNER_TEMP/kritacolor-elf-header.txt"

          "$readelf" -d "$color_library" | tee "$RUNNER_TEMP/kritacolor-dynamic.txt"
          grep -q "Shared library: \\[libkritaglobal.so\\]" "$RUNNER_TEMP/kritacolor-dynamic.txt"
          grep -q "Shared library: \\[libQt5Core_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritacolor-dynamic.txt"

          "$readelf" -Ws "$color_library" | tee "$RUNNER_TEMP/kritacolor-symbols.txt"
          grep -q "KisColorManager" "$RUNNER_TEMP/kritacolor-symbols.txt"

          "$readelf" -h "$store_library" | tee "$RUNNER_TEMP/kritastore-elf-header.txt"
          grep -Eq "$machine_pattern" "$RUNNER_TEMP/kritastore-elf-header.txt"

          "$readelf" -d "$store_library" | tee "$RUNNER_TEMP/kritastore-dynamic.txt"
          grep -q "Shared library: \\[libkritaglobal.so\\]" "$RUNNER_TEMP/kritastore-dynamic.txt"
          grep -q "Shared library: \\[libQt5Core_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritastore-dynamic.txt"

          "$readelf" -Ws "$store_library" | tee "$RUNNER_TEMP/kritastore-symbols.txt"
          grep -q "KoStore" "$RUNNER_TEMP/kritastore-symbols.txt"

          "$readelf" -h "$resources_library" | tee "$RUNNER_TEMP/kritaresources-elf-header.txt"
          grep -Eq "$machine_pattern" "$RUNNER_TEMP/kritaresources-elf-header.txt"

          "$readelf" -d "$resources_library" | tee "$RUNNER_TEMP/kritaresources-dynamic.txt"
          grep -q "Shared library: \\[libkritaglobal.so\\]" "$RUNNER_TEMP/kritaresources-dynamic.txt"
          grep -q "Shared library: \\[libkritaplugin.so\\]" "$RUNNER_TEMP/kritaresources-dynamic.txt"
          grep -q "Shared library: \\[libkritastore.so\\]" "$RUNNER_TEMP/kritaresources-dynamic.txt"
          grep -q "Shared library: \\[libQt5Core_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaresources-dynamic.txt"
          grep -q "Shared library: \\[libQt5Widgets_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaresources-dynamic.txt"
          grep -q "Shared library: \\[libQt5Sql_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaresources-dynamic.txt"

          "$readelf" -Ws "$resources_library" | tee "$RUNNER_TEMP/kritaresources-symbols.txt"
          grep -q "KisResourceLocator" "$RUNNER_TEMP/kritaresources-symbols.txt"

          "$readelf" -h "$widgetutils_library" | tee "$RUNNER_TEMP/kritawidgetutils-elf-header.txt"
          grep -Eq "$machine_pattern" "$RUNNER_TEMP/kritawidgetutils-elf-header.txt"

          "$readelf" -d "$widgetutils_library" | tee "$RUNNER_TEMP/kritawidgetutils-dynamic.txt"
          grep -q "Shared library: \\[libkritaglobal.so\\]" "$RUNNER_TEMP/kritawidgetutils-dynamic.txt"
          grep -q "Shared library: \\[libkritaresources.so\\]" "$RUNNER_TEMP/kritawidgetutils-dynamic.txt"
          grep -q "Shared library: \\[libQt5Core_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritawidgetutils-dynamic.txt"
          grep -q "Shared library: \\[libQt5Widgets_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritawidgetutils-dynamic.txt"
          grep -q "Shared library: \\[libQt5PrintSupport_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritawidgetutils-dynamic.txt"
          grep -q "Shared library: \\[libQt5AndroidExtras_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritawidgetutils-dynamic.txt"

          "$readelf" -Ws "$widgetutils_library" | tee "$RUNNER_TEMP/kritawidgetutils-symbols.txt"
          grep -q "KisActionRegistry" "$RUNNER_TEMP/kritawidgetutils-symbols.txt"

          "$readelf" -h "$command_library" | tee "$RUNNER_TEMP/kritacommand-elf-header.txt"
          grep -Eq "$machine_pattern" "$RUNNER_TEMP/kritacommand-elf-header.txt"

          "$readelf" -d "$command_library" | tee "$RUNNER_TEMP/kritacommand-dynamic.txt"
          grep -q "Shared library: \\[libkritawidgetutils.so\\]" "$RUNNER_TEMP/kritacommand-dynamic.txt"
          grep -q "Shared library: \\[libQt5Core_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritacommand-dynamic.txt"
          grep -q "Shared library: \\[libQt5Widgets_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritacommand-dynamic.txt"

          "$readelf" -Ws "$command_library" | tee "$RUNNER_TEMP/kritacommand-symbols.txt"
          grep -q "KUndo2Stack" "$RUNNER_TEMP/kritacommand-symbols.txt"

          "$readelf" -h "$pigment_library" | tee "$RUNNER_TEMP/kritapigment-elf-header.txt"
          grep -Eq "$machine_pattern" "$RUNNER_TEMP/kritapigment-elf-header.txt"

          "$readelf" -d "$pigment_library" | tee "$RUNNER_TEMP/kritapigment-dynamic.txt"
          grep -q "Shared library: \\[libkritaglobal.so\\]" "$RUNNER_TEMP/kritapigment-dynamic.txt"
          grep -q "Shared library: \\[libkritaplugin.so\\]" "$RUNNER_TEMP/kritapigment-dynamic.txt"
          grep -q "Shared library: \\[libkritastore.so\\]" "$RUNNER_TEMP/kritapigment-dynamic.txt"
          grep -q "Shared library: \\[libkritaresources.so\\]" "$RUNNER_TEMP/kritapigment-dynamic.txt"
          grep -q "Shared library: \\[libkritacommand.so\\]" "$RUNNER_TEMP/kritapigment-dynamic.txt"
          grep -q "Shared library: \\[libkritamultiarch.so\\]" "$RUNNER_TEMP/kritapigment-dynamic.txt"
          grep -q "Shared library: \\[libQt5Core_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritapigment-dynamic.txt"
          grep -q "Shared library: \\[libQt5Gui_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritapigment-dynamic.txt"
          grep -q "Shared library: \\[libQt5Xml_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritapigment-dynamic.txt"

          "$readelf" -Ws "$pigment_library" | tee "$RUNNER_TEMP/kritapigment-symbols.txt"
          grep -q "KoColorSpaceRegistry" "$RUNNER_TEMP/kritapigment-symbols.txt"

          "$readelf" -h "$metadata_library" | tee "$RUNNER_TEMP/kritametadata-elf-header.txt"
          grep -Eq "$machine_pattern" "$RUNNER_TEMP/kritametadata-elf-header.txt"

          "$readelf" -d "$metadata_library" | tee "$RUNNER_TEMP/kritametadata-dynamic.txt"
          grep -q "Shared library: \\[libkritaglobal.so\\]" "$RUNNER_TEMP/kritametadata-dynamic.txt"
          grep -q "Shared library: \\[libkritaplugin.so\\]" "$RUNNER_TEMP/kritametadata-dynamic.txt"
          grep -q "Shared library: \\[libkritawidgetutils.so\\]" "$RUNNER_TEMP/kritametadata-dynamic.txt"
          grep -q "Shared library: \\[libQt5Core_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritametadata-dynamic.txt"

          "$readelf" -Ws "$metadata_library" | tee "$RUNNER_TEMP/kritametadata-symbols.txt"
          grep -q "KisMetaData" "$RUNNER_TEMP/kritametadata-symbols.txt"

          "$readelf" -h "$flake_library" | tee "$RUNNER_TEMP/kritaflake-elf-header.txt"
          grep -Eq "$machine_pattern" "$RUNNER_TEMP/kritaflake-elf-header.txt"

          "$readelf" -d "$flake_library" | tee "$RUNNER_TEMP/kritaflake-dynamic.txt"
          grep -q "Shared library: \\[libkritapigment.so\\]" "$RUNNER_TEMP/kritaflake-dynamic.txt"
          grep -q "Shared library: \\[libkritawidgetutils.so\\]" "$RUNNER_TEMP/kritaflake-dynamic.txt"
          grep -q "Shared library: \\[libkritacommand.so\\]" "$RUNNER_TEMP/kritaflake-dynamic.txt"
          grep -q "Shared library: \\[libQt5Core_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaflake-dynamic.txt"
          grep -q "Shared library: \\[libQt5Gui_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaflake-dynamic.txt"
          grep -q "Shared library: \\[libQt5Widgets_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaflake-dynamic.txt"
          grep -q "Shared library: \\[libQt5Svg_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaflake-dynamic.txt"
          grep -q "Shared library: \\[libQt5Xml_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaflake-dynamic.txt"

          "$readelf" -Ws "$flake_library" | tee "$RUNNER_TEMP/kritaflake-symbols.txt"
          grep -q "KoShapeRegistry" "$RUNNER_TEMP/kritaflake-symbols.txt"

          "$readelf" -h "$resourcewidgets_library" | tee "$RUNNER_TEMP/kritaresourcewidgets-elf-header.txt"
          grep -Eq "$machine_pattern" "$RUNNER_TEMP/kritaresourcewidgets-elf-header.txt"

          "$readelf" -d "$resourcewidgets_library" | tee "$RUNNER_TEMP/kritaresourcewidgets-dynamic.txt"
          grep -q "Shared library: \\[libkritaglobal.so\\]" "$RUNNER_TEMP/kritaresourcewidgets-dynamic.txt"
          grep -q "Shared library: \\[libkritaplugin.so\\]" "$RUNNER_TEMP/kritaresourcewidgets-dynamic.txt"
          grep -q "Shared library: \\[libkritastore.so\\]" "$RUNNER_TEMP/kritaresourcewidgets-dynamic.txt"
          grep -q "Shared library: \\[libkritaresources.so\\]" "$RUNNER_TEMP/kritaresourcewidgets-dynamic.txt"
          grep -q "Shared library: \\[libkritawidgetutils.so\\]" "$RUNNER_TEMP/kritaresourcewidgets-dynamic.txt"
          grep -q "Shared library: \\[libQt5Core_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaresourcewidgets-dynamic.txt"
          grep -q "Shared library: \\[libQt5Widgets_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaresourcewidgets-dynamic.txt"
          grep -q "Shared library: \\[libQt5Sql_${{ matrix.abi }}.so\\]" "$RUNNER_TEMP/kritaresourcewidgets-dynamic.txt"

