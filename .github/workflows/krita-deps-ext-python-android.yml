name: Krita deps ext_python Android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/krita-deps-ext-python-android.yml"
      - "patches/krita-deps-management/0001-ext-python-android-release-package.patch"

jobs:
  build:
    name: Build ext_python ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - x86_64

    steps:
      - name: Checkout port lab
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Clone Krita deps management
        run: |
          git clone --depth 1 https://invent.kde.org/packaging/krita-deps-management.git upstream/krita-deps-management

      - name: Apply Android Python recipe patch
        run: |
          git -C upstream/krita-deps-management apply --check "$GITHUB_WORKSPACE/patches/krita-deps-management/0001-ext-python-android-release-package.patch"
          git -C upstream/krita-deps-management apply "$GITHUB_WORKSPACE/patches/krita-deps-management/0001-ext-python-android-release-package.patch"

      - name: Configure ext_python
        run: |
          cmake \
            -S upstream/krita-deps-management/ext_python \
            -B build/ext-python/${{ matrix.abi }} \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.3.13750724/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DEXTERNALS_DOWNLOAD_DIR="$GITHUB_WORKSPACE/artifacts/krita-deps-downloads" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/artifacts/krita-deps-install/${{ matrix.abi }}"

      - name: Install ext_python
        run: |
          cmake --build build/ext-python/${{ matrix.abi }} --target ext_install --verbose

      - name: Verify Android Python install
        run: |
          prefix="$GITHUB_WORKSPACE/artifacts/krita-deps-install/${{ matrix.abi }}"
          test -f "$prefix/lib/libpython3.14.so"
          test -f "$prefix/lib/libpython3.so"
          test -f "$prefix/include/python3.14/Python.h"
          test -d "$prefix/lib/python3.14/lib-dynload"
          du -sh "$prefix"

      - name: Upload ext_python install prefix
        uses: actions/upload-artifact@v4
        with:
          name: krita-deps-ext-python-${{ matrix.abi }}
          path: artifacts/krita-deps-install/${{ matrix.abi }}
