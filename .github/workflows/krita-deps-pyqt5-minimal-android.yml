name: Krita deps PyQt5 minimal Android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/krita-deps-pyqt5-minimal-android.yml"
      - "patches/krita-deps-management/*.patch"

jobs:
  build:
    name: Build minimal PyQt5 ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - x86_64

    steps:
      - name: Checkout port lab
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;21.4.7075529" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libgl1-mesa-dev libxkbcommon-x11-0

      - name: Set up host Python for dependency tools
        run: |
          python3 -m venv .venv --upgrade-deps
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install aqtinstall==3.3.0
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Qt for Android probe prefix
        run: |
          set -eux

          prefix="$GITHUB_WORKSPACE/artifacts/krita-pyqt5-minimal/${{ matrix.abi }}"
          qt_install="$RUNNER_TEMP/qt"

          python -m aqt install-qt linux android 5.15.2 android -O "$qt_install"
          mkdir -p "$prefix"
          cp -a "$qt_install/5.15.2/android/." "$prefix/"

          export LD_LIBRARY_PATH="$prefix/lib:${LD_LIBRARY_PATH:-}"
          "$prefix/bin/qmake" -query

      - name: Clone Krita deps management
        run: |
          git clone --depth 1 https://invent.kde.org/packaging/krita-deps-management.git upstream/krita-deps-management

      - name: Apply dependency patches
        run: |
          for patch in patches/krita-deps-management/*.patch; do
            git -C upstream/krita-deps-management apply "$GITHUB_WORKSPACE/$patch"
          done

      - name: Build Python tools and minimal PyQt5
        run: |
          set -eux

          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/21.4.7075529"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          configure_and_install() {
            dep="$1"
            cmake \
              -S "upstream/krita-deps-management/${dep}" \
              -B "build/pyqt5-minimal/${{ matrix.abi }}/${dep}" \
              -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.3.13750724/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="${{ matrix.abi }}" \
              -DANDROID_PLATFORM=android-24 \
              -DANDROID_STL=c++_shared \
              -DEXTERNALS_DOWNLOAD_DIR="$GITHUB_WORKSPACE/artifacts/krita-deps-downloads" \
              -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/artifacts/krita-pyqt5-minimal/${{ matrix.abi }}"

            cmake --build "build/pyqt5-minimal/${{ matrix.abi }}/${dep}" --target ext_install --verbose
          }

          configure_and_install ext_python
          configure_and_install ext_sip
          configure_and_install ext_pyqt-builder
          configure_and_install ext_pyqt5-sip
          configure_and_install ext_pyqt5

      - name: Verify Android PyQt5 modules
        run: |
          set -eux

          prefix="$GITHUB_WORKSPACE/artifacts/krita-pyqt5-minimal/${{ matrix.abi }}"
          readelf="$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          case "${{ matrix.abi }}" in
            arm64-v8a)
              triplet="aarch64-linux-android"
              machine_pattern="Machine:[[:space:]]*AArch64"
              ;;
            x86_64)
              triplet="x86_64-linux-android"
              machine_pattern="Machine:[[:space:]]*Advanced Micro Devices X86-64"
              ;;
          esac

          for module_name in sip QtCore QtNetwork QtGui QtXml QtWidgets; do
            module="$prefix/lib/python3.14/site-packages/PyQt5/${module_name}.cpython-314-${triplet}.so"
            test -f "$module"
            file "$module"

            "$readelf" -h "$module" | tee "$RUNNER_TEMP/${module_name}-elf-header.txt"
            grep -Eq "$machine_pattern" "$RUNNER_TEMP/${module_name}-elf-header.txt"

            "$readelf" -d "$module" | tee "$RUNNER_TEMP/${module_name}-dynamic.txt"
            grep -q "Shared library: \\[libpython3.14.so\\]" "$RUNNER_TEMP/${module_name}-dynamic.txt"
          done

          test -f "$prefix/lib/python3.14/site-packages/PyQt5/bindings/QtCore/QtCore.toml"

      - name: Upload minimal PyQt5 prefix
        uses: actions/upload-artifact@v4
        with:
          name: krita-deps-pyqt5-minimal-${{ matrix.abi }}
          path: artifacts/krita-pyqt5-minimal/${{ matrix.abi }}
